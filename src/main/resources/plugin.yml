name: ValleyAuth
version: '${version}'
main: com.valleyrealm.valleyauth.ValleyAuth
api-version: '1.21'
description: Opinionated authentication, identity, and player-data migration for Paper
author: SabeeirSharrma
website: https://github.com/SabeeirSharrma/ValleyAuth

# Floodgate is a soft dependency for Bedrock support
# Geyser is a soft dependency (required by Floodgate for Bedrock support)
# LuckPerms is a soft dependency for permission migration
# ProtocolLib is a soft dependency for Mojang session verification in offline-mode
softdepend:
  - floodgate
  - geyser
  - luckperms
  - ProtocolLib

commands:
  v:
    description: Valley Auth VLink command
    usage: /v link <username> <code>
    permission: valleyauth.vlink
  valleyauth:
    description: Valley Auth admin command
    usage: /valleyauth <subcommand>
    permission: valleyauth.admin
  register:
    description: Register an offline account password
    usage: /register <password>
    permission: valleyauth.register
  login:
    description: Login to an offline account
    usage: /login <password>
    permission: valleyauth.login
  migrate:
    description: Start a migration from offline to premium
    usage: /migrate [status|help]
    permission: valleyauth.migrate

permissions:
  valleyauth.vlink:
    description: Allows using VLink commands
    default: true
  valleyauth.register:
    description: Allows registering offline accounts
    default: true
  valleyauth.login:
    description: Allows logging into offline accounts
    default: true
  valleyauth.admin:
    description: Allows Valley Auth admin commands
    default: op
  valleyauth.migration.status:
    description: Allows checking migration status
    default: true
  valleyauth.migrate:
    description: Allows using the migrate command
    default: true
